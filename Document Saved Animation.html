<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Document Saved Animation</title>
<style>
:root{--bg:#0f172a;--fg:#fff;--red:#e11d48;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f172a}}
html,body{height:100%;margin:0;background:transparent;color:var(--fg);font-family:Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
#blur{position:fixed;inset:0;z-index:-1;overflow:hidden;background:rgba(15,23,42,.35);-webkit-backdrop-filter:blur(28px) saturate(1.2);backdrop-filter:blur(28px) saturate(1.2)}
#blur b{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55}
#stage{position:relative;width:min(320px,86vw);height:320px}
#doc,.ring,.shield,.pulse{position:absolute;left:50%;top:50%}
#doc{width:200px;height:260px;margin:-130px 0 0 -100px}
.strip{position:absolute;left:0;width:200px;height:20px;overflow:hidden;will-change:transform,opacity}
.page{position:absolute;left:0;width:200px;height:260px;background:#1e293b;border:1px solid #334155;box-sizing:border-box;padding:22px 20px}
.page h4{margin:0 0 14px;font-size:11px;letter-spacing:.18em;font-weight:600;color:var(--fg)}
.page i{display:block;height:5px;border-radius:3px;background:#fff;opacity:.85;margin-bottom:11px}
.page .sig{margin-top:34px;font:italic 22px Georgia,serif;color:var(--fg)}
.ring{width:120px;height:120px;margin:-60px 0 0 -60px;opacity:0}
.shield{width:88px;height:88px;margin:-44px 0 0 -44px;opacity:0;filter:drop-shadow(0 0 14px rgba(225,29,72,.55))}
.pulse{width:88px;height:88px;margin:-44px 0 0 -44px;border-radius:50%;border:2px solid var(--red);opacity:0}
#label{margin-top:8px;height:24px;font-size:13px;font-weight:600;letter-spacing:.28em;opacity:0}
button{margin-top:36px;background:none;border:1px solid #334155;color:#94a3b8;font:inherit;font-size:12px;letter-spacing:.12em;padding:10px 20px;border-radius:999px;cursor:pointer}
button:active{transform:scale(.96)}
</style></head><body>
<div id="blur"><b style="width:60vmax;height:60vmax;left:-20vmax;top:-15vmax;background:#334155"></b><b style="width:50vmax;height:50vmax;right:-15vmax;bottom:-15vmax;background:#1e293b"></b><b style="width:30vmax;height:30vmax;left:35%;top:55%;background:#e11d48;opacity:.25"></b></div>
<div id="stage">
  <div id="doc"></div>
  <svg class="ring" id="ring" viewBox="0 0 120 120"><circle cx="60" cy="60" r="50" fill="none" stroke="#e11d48" stroke-width="5" stroke-linecap="round" stroke-dasharray="210 105"/><circle cx="60" cy="60" r="38" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-dasharray="40 200" opacity=".8"/></svg>
  <div class="pulse" id="pulse"></div>
  <svg class="shield" id="shield" viewBox="0 0 64 64"><path d="M32 3 56 12v20c0 15-10 25-24 30C18 57 8 47 8 32V12z" fill="#e11d48"/><path d="M21 32l8 8 15-16" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
</div>
<div id="label">DOCUMENT SAVED</div>
<button id="replay">REPLAY</button>
<script>
const doc=document.getElementById('doc'),N=13,H=20;
const pageHTML='<h4>SERVICE AGREEMENT</h4><i style="width:100%"></i><i style="width:92%"></i><i style="width:97%"></i><i style="width:60%"></i><i style="width:100%"></i><i style="width:85%"></i><i style="width:94%"></i><i style="width:55%"></i><div class="sig">J. Carter</div>';
for(let i=0;i<N;i++){const s=document.createElement('div');s.className='strip';s.style.top=i*H+'px';
  s.innerHTML='<div class="page" style="top:'+(-i*H)+'px">'+pageHTML+'</div>';doc.appendChild(s);}
const strips=[...doc.children],ring=document.getElementById('ring'),shield=document.getElementById('shield'),
pulse=document.getElementById('pulse'),label=document.getElementById('label');
const E='cubic-bezier(.2,.8,.2,1)';
function reset(){doc.style.opacity=1;strips.forEach(s=>{s.style.transform='';s.style.opacity=1});
  [ring,shield,pulse,label].forEach(e=>e.style.opacity=0);ring.style.transform='';shield.style.transform='';}
let anims=[];
function play(){
  anims.forEach(a=>a.cancel());anims=[];reset();
  const A=(el,kf,o)=>{const a=el.animate(kf,{fill:'forwards',easing:E,...o});anims.push(a);return a};
  // Phase 1: shred (500-1500ms), document holds 0-500ms
  strips.forEach((s,i)=>{const off=i*H+H/2-130;
    A(s,[{transform:'translateY(0) scaleY(1)'},{transform:`translateY(${off*.35}px) scaleY(.12)`,offset:.5},
      {transform:`translateY(${off*.35}px) scaleY(.12)`}],{duration:500,delay:500+i*6});
    // Phase 2a: condense to center (450-800ms)
    A(s,[{transform:`translateY(${off*.35}px) scaleY(.12) scaleX(1)`,opacity:1},{transform:`translateY(0) scaleY(.12) scaleX(.2)`,opacity:0}],
      {duration:450,delay:1000+i*3,easing:'cubic-bezier(.6,0,.2,1)'});
  });
  // Phase 2b: ring spins (760-1500ms)
  A(ring,[{opacity:0,transform:'scale(.4) rotate(0deg)'},{opacity:1,transform:'scale(1) rotate(180deg)',offset:.25},
    {opacity:1,transform:'scale(1) rotate(900deg)'}],{duration:800,delay:1450,easing:'cubic-bezier(.3,0,.4,1)'});
  // Phase 3: snap to shield (1560ms)
  A(ring,[{opacity:1,transform:'scale(1)'},{opacity:0,transform:'scale(.5)'}],{duration:140,delay:2310});
  A(shield,[{opacity:0,transform:'scale(.5)'},{opacity:1,transform:'scale(1.12)',offset:.6},{opacity:1,transform:'scale(1)'}],
    {duration:260,delay:2330,easing:'cubic-bezier(.3,1.4,.5,1)'});
  A(pulse,[{opacity:.8,transform:'scale(1)'},{opacity:0,transform:'scale(2.4)'}],{duration:650,delay:2450});
  A(label,[{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'translateY(0)'}],{duration:320,delay:2600});
}
document.getElementById('replay').onclick=play;
play();
</script></body></html>
