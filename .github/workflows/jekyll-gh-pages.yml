name: Production Deployment (CI/CD)

on:
  push:
    branches:
      - main # Change to 'master' if your primary branch uses the older naming convention

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Set up Node.js environment
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # 3. Install dependencies 
      - name: Install Dependencies
        run: npm install

      # 4. Build application (Injects GitHub Repository Variables into Vite)
      - name: Execute System Production Build
        run: npm run build
        env:
          CI: false 
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      # 5. Securely deploy compiled assets to the target gh-pages branch
      - name: Deploy Assets to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
